<div class="shell">

  <!-- Mobile overlay -->
  @if (sidebarOpen()) {
    <div class="sidebar-overlay" (click)="closeSidebar()"></div>
  }

  <!-- Sidebar -->
  <aside class="sidebar" [class.is-open]="sidebarOpen()">

    <!-- Brand -->
    <div class="brand">
      <span class="brand-name">TIPBOARD</span>
      <span class="brand-sub">SPC26 · 2026</span>
    </div>

    <!-- Primary nav -->
    <nav class="nav-group">
      <a class="nav-item"
         routerLink="/"
         routerLinkActive="is-active"
         [routerLinkActiveOptions]="{ exact: true }"
         (click)="closeSidebar()">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        <span class="nav-label">Dashboard</span>
      </a>

      <a class="nav-item"
         routerLink="/entry"
         routerLinkActive="is-active"
         (click)="closeSidebar()">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <path d="M12 20h9"/>
          <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
        </svg>
        <span class="nav-label">Result Entry</span>
      </a>

      <a class="nav-item"
         routerLink="/schedule"
         routerLinkActive="is-active"
         (click)="closeSidebar()">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <rect x="3" y="4" width="18" height="18" rx="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8"  y1="2" x2="8"  y2="6"/>
          <line x1="3"  y1="10" x2="21" y2="10"/>
        </svg>
        <span class="nav-label">Schedule</span>
      </a>

      <a class="nav-item"
         routerLink="/wheel"
         routerLinkActive="is-active"
         (click)="closeSidebar()">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <circle cx="12" cy="12" r="10"/>
          <circle cx="12" cy="12" r="3"/>
          <line x1="12" y1="2" x2="12" y2="9"/>
          <line x1="12" y1="15" x2="12" y2="22"/>
          <line x1="2" y1="12" x2="9" y2="12"/>
          <line x1="15" y1="12" x2="22" y2="12"/>
        </svg>
        <span class="nav-label">Wheel Spinner</span>
      </a>
    </nav>

  </aside>

  <!-- Main content -->
  <div class="main-wrapper">

    <!-- Mobile top bar -->
    <header class="topbar">
      <button class="hamburger" (click)="toggleSidebar()" aria-label="Toggle menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <span class="topbar-brand">TIPBOARD</span>
    </header>

    <main class="main-content">
      <router-outlet />
    </main>

  </div>

</div>
